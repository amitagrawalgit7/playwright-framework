name: Playwright Smoke Tests

on:
  schedule:
    - cron: '*/5 * * * *'  
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select the test suite to run'
        required: true
        default: '@smoke'
        type: choice
        options:
          - '@smoke'
          - '@regression'
          - 'all'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Determines the grep flag dynamically based on trigger type
      - name: Run Playwright Tests
        env:
          # If triggered by schedule, default to @regression. Otherwise, use user input.
          TAG: ${{ github.event_name == 'schedule' && '@regression' || inputs.test_suite }}
        run: |
          if [ "$TAG" = "all" ]; then
            npx playwright test
          else
            npx playwright test --grep "$TAG"
          fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
